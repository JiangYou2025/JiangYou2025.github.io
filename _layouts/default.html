<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.author.name }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="author" content="{{ site.author.name }}">
  <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}">
</head>
<body>
  {% include header.html %}
  <main>
    {{ content }}
  </main>
  <section style="max-width:820px;margin:3rem auto 0;padding:0 1.5rem">
    <div style="padding:1.2rem 1.5rem;border-radius:10px;background:#f6f8fa;border:1px solid #e6e8eb;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.8rem">
      <div>
        <strong style="font-size:1.05rem">Like my work?</strong>
        <p style="margin:.3rem 0 0;color:#6a737d;font-size:.88rem">Star the KUN project on GitHub to support open research</p>
      </div>
      <a href="https://github.com/JiangYou2025/kun" target="_blank" rel="noopener"
         style="display:inline-flex;align-items:center;gap:.4rem;padding:.55rem 1.2rem;border-radius:6px;background:#0b5cad;color:#fff;font-weight:600;font-size:.92rem;text-decoration:none;white-space:nowrap;transition:opacity .2s"
         onmouseover="this.style.opacity='0.85'" onmouseout="this.style.opacity='1'">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.75.75 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25z"/></svg>
        Star on GitHub
      </a>
    </div>

    <div style="margin-top:2rem">
      <h2 style="margin-bottom:.5rem;font-size:1.3rem">Comments & Feedback</h2>
      <p style="color:#6a737d;font-size:.9rem;margin-bottom:1.5rem">React or leave a comment (requires GitHub account)</p>
      <script src="https://giscus.app/client.js"
        data-repo="JiangYou2025/kun"
        data-repo-id="R_kgDOStMZRw"
        data-category="General"
        data-category-id="DIC_kwDOStMZR84C-fgZ"
        data-mapping="pathname"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="top"
        data-theme="light"
        data-lang="en"
        data-loading="lazy"
        crossorigin="anonymous"
        async>
      </script>
    </div>
  </section>

  {% include footer.html %}
  <script src="{{ '/assets/js/scripts.js' | relative_url }}"></script>
</body>
</html>
